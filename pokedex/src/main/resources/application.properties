spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 datasource (embedded in-memory)
spring.datasource.url=jdbc:h2:mem:pokedex;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ensure Hibernate does not manage the schema (we use data.sql)
spring.jpa.hibernate.ddl-auto=none

# Always run SQL init scripts and make sure they run at the right time
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Optional: show SQL in logs for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



